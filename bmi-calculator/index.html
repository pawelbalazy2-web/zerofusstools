<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator — Body Mass Index Online</title>
<meta name="description" content="Free BMI calculator. Calculate your body mass index from height and weight — no signup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9406337676828505" crossorigin="anonymous"></script>
<style>
  :root{ --ink:#122225; --surface:#173035; --line:#274248; --paper:#e9f3f2; --muted:#7fa3a0; --accent:#2ba8a0; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:64px 20px 40px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--accent); margin-bottom:14px; }
  h1{ font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(30px,4.8vw,44px); text-align:center; max-width:600px; margin:0 0 12px; }
  .sub{ color:var(--muted); text-align:center; max-width:460px; font-size:15px; margin:0 0 40px; }
  .card{ width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:28px; }
  .unit-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .unit-btn{ flex:1; padding:10px; background:var(--ink); border:1px solid var(--line); border-radius:6px; color:var(--muted); cursor:pointer; }
  .unit-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:8px; }
  input[type="number"]{ width:100%; background:var(--ink); border:1px solid var(--line); border-radius:6px; padding:14px 16px; font-family:'IBM Plex Mono',monospace; font-size:17px; color:var(--paper); outline:none; }
  .result-box{ margin-top:8px; background:var(--ink); border:1px solid var(--line); border-radius:6px; padding:26px; text-align:center; }
  .result-value{ font-family:'Sora',sans-serif; font-weight:800; font-size:38px; color:var(--accent); }
  .result-cat{ font-size:14px; color:var(--muted); margin-top:8px; }
  .disclaimer{ margin-top:20px; font-size:12.5px; color:var(--muted); line-height:1.6; text-align:center; }
  footer{ margin-top:48px; color:#3d5c5a; font-size:12px; font-family:'IBM Plex Mono',monospace; text-align:center; }
  footer a{ color:#3d5c5a; }
</style>
</head>
<body>
  <div class="eyebrow">tool / health</div>
  <h1>BMI Calculator</h1>
  <p class="sub">Check your body mass index from height and weight.</p>

  <div class="card">
    <div class="unit-toggle">
      <button class="unit-btn active" data-unit="metric">Metric (kg/cm)</button>
      <button class="unit-btn" data-unit="imperial">Imperial (lb/in)</button>
    </div>
    <div class="field"><label id="weightLabel">WEIGHT (KG)</label><input type="number" id="weight" value="70"></div>
    <div class="field"><label id="heightLabel">HEIGHT (CM)</label><input type="number" id="height" value="175"></div>
    <div class="result-box"><div class="result-value" id="bmiResult">—</div><div class="result-cat" id="bmiCategory"></div></div>
    <p class="disclaimer">This is a general guide, not a substitute for medical advice. BMI doesn't account for muscle mass, age, or body composition.</p>
  </div>

  <footer>Zero Fuss Tools &nbsp;·&nbsp; <a href="/privacy-policy.html">privacy policy</a> &nbsp;·&nbsp; <a href="/terms.html">terms</a></footer>

<script>
  let unit='metric';
  document.querySelectorAll('.unit-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.unit-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    unit=btn.dataset.unit;
    document.getElementById('weightLabel').textContent = unit==='metric'?'WEIGHT (KG)':'WEIGHT (LB)';
    document.getElementById('heightLabel').textContent = unit==='metric'?'HEIGHT (CM)':'HEIGHT (IN)';
    calc();
  }));
  const weight=document.getElementById('weight'), height=document.getElementById('height');
  function calc(){
    let w=parseFloat(weight.value), h=parseFloat(height.value);
    if(!w||!h){ document.getElementById('bmiResult').textContent='—'; document.getElementById('bmiCategory').textContent=''; return; }
    let bmi;
    if(unit==='metric'){ bmi = w/((h/100)*(h/100)); }
    else{ bmi = (w/(h*h))*703; }
    document.getElementById('bmiResult').textContent=bmi.toFixed(1);
    let cat;
    if(bmi<18.5) cat='Underweight'; else if(bmi<25) cat='Normal weight'; else if(bmi<30) cat='Overweight'; else cat='Obese';
    document.getElementById('bmiCategory').textContent=cat;
  }
  weight.addEventListener('input',calc); height.addEventListener('input',calc); calc();
</script>
</body>
</html>
